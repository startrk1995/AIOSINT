[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "pydantic",
    "pydantic-settings",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
osint = "osint.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
